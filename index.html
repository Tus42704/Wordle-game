
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>
  <main class="app">
    <section class="hero">
      <p class="eyebrow">Guess the hidden word</p>
      <h1>Wordle</h1>
      <p class="subtitle">Solve the 5-letter word in 6 tries or fewer.</p>
    </section>

    <section class="game-card">
      <div class="status-row">
        <p id="message" class="message">Start with any 5-letter word.</p>
        <button id="new-game" class="new-game" type="button">New Game</button>
      </div>

      <div class="guess-controls">
        <input id="guess-input" class="guess-input" type="text" maxlength="5" placeholder="Type a word" autocomplete="off" aria-label="Enter a 5-letter word">
        <button id="submit-guess" class="submit-guess" type="button">Submit</button>
      </div>

      <div id="board" class="board" aria-label="Wordle board"></div>

      <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
